name: Gradle Dependency Security Inventory

on:
  push:
    branches:
      - main
    paths:
      - "02_backend/visionflow-api/**"
      - ".github/workflows/gradle-dependency-submission.yml"
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-gradle-dependencies:
    name: Submit resolved Gradle dependency graph
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Submit resolved Gradle dependencies to GitHub
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: 02_backend/visionflow-api
