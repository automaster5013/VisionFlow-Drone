name: Publish VisionFlow images to Docker Hub

on:
  workflow_run:
    workflows:
      - API contract, security, and system traceability audit
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visionflow-dockerhub-publish
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: visionflow-drone

jobs:
  prepare:
    name: Prepare immutable image version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.version.outputs.full_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      release_required: ${{ steps.release-plan.outputs.release_required }}
      changed_components: ${{ steps.release-plan.outputs.changed_components }}
      release_reason: ${{ steps.release-plan.outputs.release_reason }}
      base_sha: ${{ steps.release-plan.outputs.base_sha }}

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate publish source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" \
               || "${{ github.event.workflow_run.event }}" != "push" \
               || "${{ github.event.workflow_run.head_branch }}" != "main" ]]; then
              echo "::error::Automatic workflow_run must come from a successful main push."
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Manual Docker Hub publishing is allowed only from the main branch."
            exit 1
          fi

      - name: Resolve source commit
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          echo "full_sha=${FULL_SHA}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Docker Hub publish source"
            echo
            echo "- Commit: \`${FULL_SHA}\`"
            echo "- Repository: \`${{ vars.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPOSITORY}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- AI runtime: CUDA-enabled PyTorch; model weights remain external read-only artifacts"
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Plan container release
        id: release-plan
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_AUDIT_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ steps.version.outputs.full_sha }}
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_PATHS_FILE="${RUNNER_TEMP}/visionflow-release-changed-paths.txt"
          : > "${CHANGED_PATHS_FILE}"
          BASE_SHA=""
          FORCE_RELEASE=false

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            FORCE_RELEASE=true
          else
            RUNS_JSON="$(
              curl --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "${API_URL}/repos/${REPOSITORY}/actions/workflows/api-audit.yml/runs?branch=main&event=push&per_page=20"
            )"

            BASE_SHA="$(
              printf '%s' "${RUNS_JSON}" |
                python -c '
          import json
          import os
          import sys

          payload = json.load(sys.stdin)
          current_id = os.environ.get("CURRENT_AUDIT_RUN_ID", "")
          source_sha = os.environ["SOURCE_SHA"]

          for run in payload.get("workflow_runs", []):
              run_id = str(run.get("id", ""))
              head_sha = str(run.get("head_sha", ""))
              if run_id == current_id:
                  continue
              if not head_sha or head_sha == source_sha:
                  continue
              print(head_sha)
              break
          '
            )"

            if [[ -z "${BASE_SHA}" ]] || \
               ! git merge-base --is-ancestor "${BASE_SHA}" "${SOURCE_SHA}" 2>/dev/null; then
              BASE_SHA="$(git rev-parse "${SOURCE_SHA}^1" 2>/dev/null || true)"
            fi

            if [[ -n "${BASE_SHA}" ]]; then
              git diff --name-only \
                "${BASE_SHA}" \
                "${SOURCE_SHA}" \
                > "${CHANGED_PATHS_FILE}"
            else
              FORCE_RELEASE=true
            fi
          fi

          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"

          PLAN_ARGS=(
            --changed-paths-file "${CHANGED_PATHS_FILE}"
            --github-output "${GITHUB_OUTPUT}"
            --summary "${GITHUB_STEP_SUMMARY}"
          )

          if [[ "${FORCE_RELEASE}" == "true" ]]; then
            PLAN_ARGS+=(--force)
          fi

          python scripts/visionflow_container_release_plan.py "${PLAN_ARGS[@]}"

          {
            echo
            echo "### Main change range"
            echo
            echo "- Base: \`${BASE_SHA:-none}\`"
            echo "- Head: \`${SOURCE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Require successful API audit for exact commit
        if: steps.release-plan.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.full_sha }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(
            curl --fail --silent --show-error               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer ${GH_TOKEN}"               -H "X-GitHub-Api-Version: 2026-03-10"               "${API_URL}/repos/${REPOSITORY}/actions/workflows/api-audit.yml/runs?branch=main&event=push&status=success&head_sha=${SOURCE_SHA}&per_page=1"
          )"

          RUN_COUNT="$(
            printf '%s' "${RESPONSE}" |
              python -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs", [])))'
          )"

          if [[ "${RUN_COUNT}" != "1" ]]; then
            echo "::error::No successful API audit push run exists for ${SOURCE_SHA}."
            echo "::error::Wait for the API audit workflow to pass, then run this publish workflow again."
            exit 1
          fi

          echo "Verified successful API audit for ${SOURCE_SHA}."

      - name: Validate Docker Hub credentials
        if: steps.release-plan.outputs.release_required == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME is missing."
            exit 1
          fi
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is missing."
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.component }}
    needs: prepare
    if: needs.prepare.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./01_frontend/visionflow-web
            build_args: ""
          - component: backend
            context: ./02_backend/visionflow-api
            build_args: ""
          - component: ai
            context: ./03_ai-server/visionflow-ai
            build_args: |-
              TORCH_VERSION=2.12.1
              TORCHVISION_VERSION=0.27.1
              TORCH_INDEX_URL=https://download.pytorch.org/whl/cu130

    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${DOCKERHUB_REPOSITORY}"
          TAG="${{ matrix.component }}-sha-${{ needs.prepare.outputs.short_sha }}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ref=${IMAGE}:${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.component }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.full_sha }}
          cache-from: type=gha,scope=visionflow-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=visionflow-${{ matrix.component }}

      - name: Verify pushed digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >/dev/null
          {
            echo "### ${{ matrix.component }} image"
            echo
            echo "- Tag: \`${{ steps.image.outputs.ref }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
