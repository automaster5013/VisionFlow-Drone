    branches:
      - main
      - "feature/**"
    paths:
      - "**"
      - ".github/workflows/api-audit.yml"
      - ".github/workflows/docker-publish.yml"
      - ".env.example"
      - "compose.yaml"
      - "compose.release.yaml"
      - "01_frontend/visionflow-web/src/app/ai-preview/**"
      - "01_frontend/visionflow-web/src/app/api/**"
      - "01_frontend/visionflow-web/src/app/audit-logs/**"
      - "01_frontend/visionflow-web/src/app/cameras/**"
      - "01_frontend/visionflow-web/src/app/dashboard/**"
      - "01_frontend/visionflow-web/src/app/events/**"
      - "01_frontend/visionflow-web/src/app/maintenance/**"
      - "01_frontend/visionflow-web/src/app/mobile-camera/**"
      - "01_frontend/visionflow-web/src/app/mobile-control/**"
      - "01_frontend/visionflow-web/src/app/mobile-flight/**"
      - "01_frontend/visionflow-web/src/app/models/**"
      - "01_frontend/visionflow-web/src/app/security-status/**"
      - "01_frontend/visionflow-web/src/app/settings/**"
      - "01_frontend/visionflow-web/src/app/statistics/**"
      - "01_frontend/visionflow-web/src/components/events/**"
      - "01_frontend/visionflow-web/src/components/layout/**"
      - "01_frontend/visionflow-web/src/components/maintenance/**"
      - "01_frontend/visionflow-web/src/components/mobile/**"
      - "01_frontend/visionflow-web/src/components/models/**"
      - "01_frontend/visionflow-web/src/components/security/**"
      - "01_frontend/visionflow-web/src/components/settings/**"
      - "01_frontend/visionflow-web/src/components/statistics/**"
      - "01_frontend/visionflow-web/src/lib/**"
      - "01_frontend/visionflow-web/src/types/ai-browser-ingest.ts"
      - "01_frontend/visionflow-web/src/types/event-operations.ts"
      - "01_frontend/visionflow-web/src/types/flight-session-management.ts"
      - "01_frontend/visionflow-web/src/types/maintenance-*.ts"
      - "01_frontend/visionflow-web/src/types/mobile-telemetry.ts"
      - "01_frontend/visionflow-web/src/types/ai-model-operations.ts"
      - "01_frontend/visionflow-web/src/types/operations-statistics.ts"
      - "01_frontend/visionflow-web/src/types/operator-console-settings.ts"
      - "02_backend/visionflow-api/src/main/java/**"
      - "02_backend/visionflow-api/src/main/resources/db/migration/**"
      - "03_ai-server/visionflow-ai/app/**"
      - "scripts/visionflow_api_contract_audit.py"
      - "scripts/visionflow_api_contract_baseline.json"
      - "scripts/visionflow_api_security_audit.py"
      - "scripts/visionflow_api_security_baseline.json"
      - "scripts/visionflow_ai_openapi_snapshot.py"
      - "scripts/visionflow_ci_api_audit_gate.py"
      - "scripts/visionflow_ci_api_audit_policy.json"
      - "scripts/visionflow_config_preflight.py"
      - "scripts/visionflow_data_integrity_audit.py"
      - "scripts/visionflow_data_integrity_policy.json"
      - "scripts/visionflow_system_traceability_audit.py"
      - "scripts/visionflow_system_traceability_baseline.json"
      - "scripts/tests/test_visionflow_system_traceability_*.py"
      - "docs/VISIONFLOW-SYSTEM-TRACEABILITY.md"
      - "docs/README-security-configuration.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-api-audit:
    name: Static API and data-flow drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      OUTPUT_ROOT: artifacts/ci-api-audit

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: 02_backend/visionflow-api/gradle/wrapper/gradle-wrapper.properties

      - name: Start isolated MySQL 8.4 for backend tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d             --name visionflow-ci-mysql             -e MYSQL_DATABASE=visionflow             -e MYSQL_USER=visionflow             -e MYSQL_PASSWORD=visionflow-ci-password             -e MYSQL_ROOT_PASSWORD=visionflow-ci-root             -p 3306:3306             mysql:8.4             --character-set-server=utf8mb4             --collation-server=utf8mb4_unicode_ci

          for attempt in {1..60}; do
            if docker exec visionflow-ci-mysql               mysqladmin ping               -h 127.0.0.1               -uroot               -pvisionflow-ci-root               --silent; then
              echo "MYSQL_CI_READY=PASS"
              exit 0
            fi
            sleep 2
          done

          echo "::error::MySQL 8.4 did not become ready."
          docker logs visionflow-ci-mysql || true
          exit 1

      - name: Run backend tests
        working-directory: 02_backend/visionflow-api
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/visionflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: visionflow
          SPRING_DATASOURCE_PASSWORD: visionflow-ci-password
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Stop isolated MySQL
        if: always()
        shell: bash
        run: |
          docker rm -f visionflow-ci-mysql >/dev/null 2>&1 || true

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: 01_frontend/visionflow-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: 01_frontend/visionflow-web
        run: npm ci

      - name: Run frontend lint
        working-directory: 01_frontend/visionflow-web
        run: npm run lint

      - name: Run frontend production build
        working-directory: 01_frontend/visionflow-web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03_ai-server/visionflow-ai/requirements.txt

      - name: Install AI test dependencies
        working-directory: 03_ai-server/visionflow-ai
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install             "torch==2.12.1"             "torchvision==0.27.1"             --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run AI regression tests
        working-directory: 03_ai-server/visionflow-ai
        run: python -m pytest -q

      - name: Validate audit sources
        run: |
          python -m py_compile \
            scripts/visionflow_api_contract_audit.py \
            scripts/visionflow_api_security_audit.py \
            scripts/visionflow_ai_openapi_snapshot.py \
            scripts/visionflow_ci_api_audit_gate.py \
            scripts/visionflow_config_preflight.py \
            scripts/visionflow_data_integrity_audit.py \
            scripts/visionflow_system_traceability_audit.py
          python -m json.tool scripts/visionflow_api_contract_baseline.json >/dev/null
          python -m json.tool scripts/visionflow_api_security_baseline.json >/dev/null
          python -m json.tool scripts/visionflow_ci_api_audit_policy.json >/dev/null
          python -m json.tool scripts/visionflow_data_integrity_policy.json >/dev/null
          python -m json.tool scripts/visionflow_system_traceability_baseline.json >/dev/null

      - name: Run system traceability policy tests
        run: |
          python -m unittest discover \
            -s scripts/tests \
            -p "test_visionflow_system_traceability_*.py" \
            -v

      - name: Generate source-derived AI OpenAPI inventory
        run: |
          python scripts/visionflow_ai_openapi_snapshot.py \
            --root . \
            --output "$OUTPUT_ROOT/ai-openapi.json"

      - name: Run API contract audit
        run: |
          python scripts/visionflow_api_contract_audit.py \
            --root . \
            --ai-openapi-file "$OUTPUT_ROOT/ai-openapi.json" \
            --skip-backend-openapi-probe \
            --output "$OUTPUT_ROOT/contract"

      - name: Run API security audit
        run: |
          python scripts/visionflow_api_security_audit.py \
            --root . \
            --ai-openapi-file "$OUTPUT_ROOT/ai-openapi.json" \
            --skip-runtime \
            --strict \
            --output "$OUTPUT_ROOT/security"

      - name: Run system traceability audit
        run: |
          python scripts/visionflow_system_traceability_audit.py \
            --root . \
            --output "$OUTPUT_ROOT/traceability"

      - name: Enforce CI audit policy
        run: |
          python scripts/visionflow_ci_api_audit_gate.py \
            --contract-report "$OUTPUT_ROOT/contract/visionflow-api-contract-audit.json" \
            --security-report "$OUTPUT_ROOT/security/visionflow-api-security-audit.json" \
            --traceability-report "$OUTPUT_ROOT/traceability/visionflow-system-traceability-audit.json" \
            --policy scripts/visionflow_ci_api_audit_policy.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visionflow-api-and-traceability-audit-reports
          path: artifacts/ci-api-audit
          if-no-files-found: warn
          retention-days: 14
