services:
  ai-server:
    environment:
      AI_MODEL_PROFILE: yolo26m-finetuned-best
      AI_MODEL_PATH: /app/models/best.pt
      AI_REQUIRE_LOCAL_MODEL: "true"
      AI_DEVICE: "0"
      AI_REQUIRE_CUDA: "true"
      AI_EVENT_MIN_CONSECUTIVE_FRAMES: "5"
      AI_EVENT_COOLDOWN_SECONDS: "10"
    volumes:
      - type: bind
        source: ./03_ai-server/visionflow-ai/models
        target: /app/models
        read_only: true
