spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/visionflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:visionflow}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    show-sql: false

logging:
  level:
    root: info
    com.visionflow: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

visionflow:
  demo:
    enabled: ${VISIONFLOW_DEMO_ENABLED:true}
    seed-drones: ${VISIONFLOW_DEMO_SEED_DRONES:true}
