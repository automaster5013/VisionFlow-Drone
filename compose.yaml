name: visionflow

services:
  mysql:
    image: mysql:8.4
    container_name: visionflow-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-visionflow}
      MYSQL_USER: ${MYSQL_USER:-visionflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - visionflow_mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - visionflow-network

  backend-api:
    build:
      context: ./02_backend/visionflow-api
      dockerfile: Dockerfile
    container_name: visionflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-visionflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-visionflow}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      VISIONFLOW_DEMO_ENABLED: ${VISIONFLOW_DEMO_ENABLED:-true}

      VISIONFLOW_OPERATOR_SECURITY_ENABLED: ${VISIONFLOW_OPERATOR_SECURITY_ENABLED:-false}
      VISIONFLOW_VIEWER_NAME: ${VISIONFLOW_VIEWER_NAME:-viewer}
      VISIONFLOW_VIEWER_KEY: ${VISIONFLOW_VIEWER_KEY:-}
      VISIONFLOW_OPERATOR_NAME: ${VISIONFLOW_OPERATOR_NAME:-operator}
      VISIONFLOW_OPERATOR_KEY: ${VISIONFLOW_OPERATOR_KEY:-}
      VISIONFLOW_ADMIN_NAME: ${VISIONFLOW_ADMIN_NAME:-admin}
      VISIONFLOW_ADMIN_KEY: ${VISIONFLOW_ADMIN_KEY:-}
      VISIONFLOW_OPERATOR_SESSION_TTL: ${VISIONFLOW_OPERATOR_SESSION_TTL:-PT8H}
      VISIONFLOW_OPERATOR_SESSION_MAXIMUM_ACTIVE: ${VISIONFLOW_OPERATOR_SESSION_MAXIMUM_ACTIVE:-1000}
      VISIONFLOW_OPERATOR_SESSION_IDLE_TIMEOUT: ${VISIONFLOW_OPERATOR_SESSION_IDLE_TIMEOUT:-PT30M}

      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./artifacts/backend-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - visionflow-network

  ai-server:
    build:
      context: ./03_ai-server/visionflow-ai
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${AI_TORCH_VERSION:-2.12.1}
        TORCHVISION_VERSION: ${AI_TORCHVISION_VERSION:-0.27.1}
        TORCH_INDEX_URL: ${AI_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: visionflow-ai
    restart: unless-stopped
    ports:
      - "${AI_HOST_PORT:-8000}:8000"
    environment:
      AI_SOURCE_TYPE: ${AI_SOURCE_TYPE:-SMARTPHONE_LIVE}
      AI_SOURCE_ID: ${AI_SOURCE_ID:-browser-camera-001}
      AI_DRONE_ID: ${AI_DRONE_ID:-1}
      AI_DUMMY_VIDEO_PATH: ${AI_DUMMY_VIDEO_PATH:-/app/data/dummy/sample.mp4}
      AI_LOOP_VIDEO: ${AI_LOOP_VIDEO:-true}
      AI_REALTIME_PLAYBACK: ${AI_REALTIME_PLAYBACK:-true}
      AI_SMARTPHONE_INPUT_MODE: ${AI_SMARTPHONE_INPUT_MODE:-BROWSER_UPLOAD}
      AI_BROWSER_UPLOAD_FPS: ${AI_BROWSER_UPLOAD_FPS:-5.0}
      AI_BROWSER_UPLOAD_QUEUE_CAPACITY: ${AI_BROWSER_UPLOAD_QUEUE_CAPACITY:-3}
      AI_BROWSER_UPLOAD_MAX_PAYLOAD_BYTES: ${AI_BROWSER_UPLOAD_MAX_PAYLOAD_BYTES:-2000000}
      AI_MODEL_PROFILE: ${AI_MODEL_PROFILE:-yolo26n-cpu}
      AI_MODEL_PATH: ${AI_MODEL_PATH:-yolo26n.pt}
      AI_REQUIRE_CUDA: ${AI_REQUIRE_CUDA:-false}
      AI_REQUIRE_LOCAL_MODEL: ${AI_REQUIRE_LOCAL_MODEL:-false}
      AI_CONFIDENCE: ${AI_CONFIDENCE:-0.35}
      AI_IOU: ${AI_IOU:-0.70}
      AI_IMAGE_SIZE: ${AI_IMAGE_SIZE:-640}
      AI_DEVICE: ${AI_DEVICE:-cpu}
      AI_PERFORMANCE_WARNING_P95_MS: ${AI_PERFORMANCE_WARNING_P95_MS:-250}
      AI_PERFORMANCE_CRITICAL_P95_MS: ${AI_PERFORMANCE_CRITICAL_P95_MS:-500}
      AI_PERFORMANCE_WARNING_PROCESSING_RATIO: ${AI_PERFORMANCE_WARNING_PROCESSING_RATIO:-0.90}
      AI_PERFORMANCE_CRITICAL_PROCESSING_RATIO: ${AI_PERFORMANCE_CRITICAL_PROCESSING_RATIO:-0.70}
      AI_PERFORMANCE_WARNING_DROP_RATE_PCT: ${AI_PERFORMANCE_WARNING_DROP_RATE_PCT:-1.0}
      AI_PERFORMANCE_CRITICAL_DROP_RATE_PCT: ${AI_PERFORMANCE_CRITICAL_DROP_RATE_PCT:-5.0}
      AI_PERFORMANCE_WARNING_QUEUE_UTILIZATION_PCT: ${AI_PERFORMANCE_WARNING_QUEUE_UTILIZATION_PCT:-67}
      AI_PERFORMANCE_CRITICAL_QUEUE_UTILIZATION_PCT: ${AI_PERFORMANCE_CRITICAL_QUEUE_UTILIZATION_PCT:-100}
      AI_PERFORMANCE_STALE_AFTER_SECONDS: ${AI_PERFORMANCE_STALE_AFTER_SECONDS:-5}
      AI_PERFORMANCE_MIN_SAMPLE_COUNT: ${AI_PERFORMANCE_MIN_SAMPLE_COUNT:-5}
      AI_SAVE_ANNOTATED_VIDEO: ${AI_SAVE_ANNOTATED_VIDEO:-true}
      AI_OUTPUT_VIDEO_PATH: /app/output/annotated.mp4
      AI_SHOW_PREVIEW: "false"
      AI_MAX_FRAMES: ${AI_MAX_FRAMES:-0}
      AI_REPORT_EVENTS: ${AI_REPORT_EVENTS:-true}
      AI_BACKEND_EVENT_URL: http://backend-api:8080/api/ai/events
      AI_SNAPSHOT_ENABLED: ${AI_SNAPSHOT_ENABLED:-true}
      AI_STREAM_ENABLED: "true"
      AI_STREAM_HOST: 0.0.0.0
      AI_STREAM_PORT: 8000
      AI_STREAM_ALLOWED_ORIGINS: ${AI_STREAM_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TZ: Asia/Seoul
    depends_on:
      backend-api:
        condition: service_healthy
    volumes:
      - ./artifacts/ai-output:/app/output
      - ./artifacts/model-evaluation:/app/artifacts/model-evaluation
      - ./03_ai-server/visionflow-ai/models:/app/models:ro
      - ./03_ai-server/visionflow-ai/data/dummy:/app/data/dummy:ro
      - ./03_ai-server/visionflow-ai/datasets:/app/datasets:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - visionflow-network

  frontend-web:
    build:
      context: ./01_frontend/visionflow-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL:-ws://localhost:8080/ws}
        NEXT_PUBLIC_AI_STREAM_URL: ${NEXT_PUBLIC_AI_STREAM_URL:-http://localhost:8000/api/streams/annotated.mjpeg}
    container_name: visionflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      SPRING_API_URL: http://backend-api:8080
      BACKEND_API_URL: http://backend-api:8080
      AI_STREAM_API_URL: http://ai-server:8000

      VISIONFLOW_WEB_OPERATOR_KEY: ${VISIONFLOW_FRONTEND_OPERATOR_KEY:-}
      VISIONFLOW_WEB_AUTH_MODE: ${VISIONFLOW_WEB_AUTH_MODE:-static}
      VISIONFLOW_WEB_SECURE_COOKIES: ${VISIONFLOW_WEB_SECURE_COOKIES:-false}
      VISIONFLOW_MOBILE_EVIDENCE_DIRECTORY: /app/artifacts/mobile-readiness

      NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL:-ws://localhost:8080/ws}
      NEXT_PUBLIC_AI_STREAM_URL: ${NEXT_PUBLIC_AI_STREAM_URL:-http://localhost:8000/api/streams/annotated.mjpeg}
      NODE_ENV: production
      TZ: Asia/Seoul
    volumes:
      - ./artifacts/mobile-readiness:/app/artifacts/mobile-readiness:ro
    depends_on:
      backend-api:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/dashboard').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - visionflow-network

volumes:
  visionflow_mysql_data:

networks:
  visionflow-network:
    driver: bridge
