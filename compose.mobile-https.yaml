services:
  mobile-https:
    image: caddy:2-alpine
    container_name: visionflow-mobile-https
    restart: unless-stopped
    ports:
      - "${VISIONFLOW_MOBILE_HTTPS_PORT:-3443}:3443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infrastructure/mobile-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/mobile-https/certs:/certs:ro
    healthcheck:
      test:
        - CMD
        - /bin/busybox
        - wget
        - --no-check-certificate
        - -q
        - -O
        - /dev/null
        - https://127.0.0.1:3443/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
