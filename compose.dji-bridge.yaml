services:
  ai-server:
    environment:
      AI_SOURCE_TYPE: DJI_LIVE
      AI_DJI_INPUT_MODE: ANDROID_BRIDGE
      AI_DJI_BRIDGE_FPS: ${AI_DJI_BRIDGE_FPS:-10.0}
      AI_DJI_BRIDGE_QUEUE_CAPACITY: ${AI_DJI_BRIDGE_QUEUE_CAPACITY:-8}
      AI_DJI_BRIDGE_FFMPEG: ${AI_DJI_BRIDGE_FFMPEG:-ffmpeg}
      AI_DJI_BRIDGE_DECODER_LOG_LEVEL: ${AI_DJI_BRIDGE_DECODER_LOG_LEVEL:-warning}
      VISIONFLOW_DJI_BRIDGE_KEY: ${VISIONFLOW_DJI_BRIDGE_KEY:?VISIONFLOW_DJI_BRIDGE_KEY is required}
